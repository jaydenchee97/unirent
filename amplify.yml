version: 1.0
frontend:
  phases:
    preBuild:
      commands:
        - npm install --quiet expo-cli  # Local installation
        - >
          if [ -f yarn.lock ]; then
            yarn --frozen-lockfile
          elif [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
            npm ci
          else
            npm install
          fi
    build:
      commands:
        - echo "EXPO_PUBLIC_GOOGLE_MAPS_API_KEY=$GOOGLE_MAPS_API_KEY" >> .env
        - EXPO_NO_SPAWN=1 npx expo export --platform web
  artifacts:
    baseDirectory: dist
    files:
      - "**/*"
  cache:
    paths:
      - node_modules/**/*
